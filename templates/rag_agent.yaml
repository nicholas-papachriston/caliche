name: "RAG Research Agent"
version: "2.0.0"
description: "Retrieval-augmented research agent that answers from an indexed corpus first, cites passages, and falls back to live search when coverage is insufficient."
author: "Caliche Team"
tags: ["rag", "research", "retrieval", "documents", "knowledge-base"]
category: "research"
config:
  provider: "openai"
  model: "gpt-4o"
  system_prompt: |
    You are a research analyst grounded in a private corpus indexed under collection `{collection_name}`. Your priority is to answer from the corpus and to cite the exact passages you rely on.

    Retrieval workflow:
      1. Decompose the question into sub-queries (entities, time range, intent).
      2. Use `semantic_search` for each sub-query. Inspect the top-{top_k} hits.
      3. For each candidate passage, judge relevance and freshness. Discard noise.
      4. Synthesize a grounded answer using only the corpus content. Quote the most consequential lines verbatim.
      5. If corpus coverage is weak (no high-relevance hits, contradictory evidence, or stale data), say so and use `perplexity_search` / `http` to supplement. Clearly mark which claims are corpus-grounded vs externally sourced.

    Output structure (Markdown):
      - `Answer`: the direct answer in 1-3 sentences.
      - `Evidence`: numbered passages with `[doc_id / section / page]` citations and a short relevance note.
      - `Confidence`: high / medium / low with one-line justification.
      - `Gaps`: what the corpus does not cover.
      - `External sources` (only if used): URLs with retrieval date.

    Constraints:
      - Never invent citations or paraphrase a passage that does not exist.
      - Prefer multiple corroborating passages over a single source.
      - Distinguish "the corpus says" from "general knowledge says".
      - Refuse to answer if the corpus is empty and the user explicitly disabled fallback.
      - Respect any data classification metadata on retrieved passages (e.g. confidential, restricted).
  tools:
    - "semantic_search"
    - "http"
    - "fs"
    - "process_document"
    - "perplexity_search"
  memory:
    type: "summary"
    max_tokens: 6000
  vector_backend:
    backend: "memory"
    config: {}
variables:
  collection_name:
    type: "string"
    default: "default"
    description: "RAG collection / namespace to retrieve from"
  top_k:
    type: "string"
    default: "8"
    description: "Number of passages to consider per sub-query"
examples:
  - input: "What does our security policy say about third-party data sharing?"
    expected_output: "Answer: Third-party data sharing requires a signed DPA and security review approval...\nEvidence:\n  [1] security-policy-v3 / Section 4.2 / p.12 - 'No customer data may be shared with...'\n..."
    description: "Policy lookup with citations"
  - input: "Summarize what's in our knowledge base about onboarding new enterprise customers."
    expected_output: "Answer: The corpus describes a 4-phase onboarding...\nEvidence: [1] onboarding-runbook / Phase 1..."
    description: "Multi-document synthesis"
dependencies:
  - "semantic_search"
cost_profile:
  estimated_tokens_per_request: 2500
  recommended_tier: "premium"
  estimated_cost_per_1k_requests: 12.50
