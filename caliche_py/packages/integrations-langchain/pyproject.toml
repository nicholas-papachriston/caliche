[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "caliche-integrations-langchain"
version = "0.1.0"
description = "LangChain adapters for Caliche Python"
requires-python = ">=3.10"
classifiers = [
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Nicholas Papachriston", email = "nicholas@papachriston.com" }]
dependencies = [
  "caliche-core==0.1.0",
  "langchain-core>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["python/caliche_integrations_langchain"]

[project.urls]
Repository = "https://github.com/nicholas-papachriston/caliche"
Homepage = "https://github.com/nicholas-papachriston/caliche"
