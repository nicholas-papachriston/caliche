# Optional secretspec declarations for local development.
# Values are never committed; inject with `sset` / `ssrun`.
# AWS credentials come from IAM Identity Center profiles, not secretspec.

[project]
name = "caliche"
revision = "1.0"

[profiles.default]
GOOGLE_API_KEY = { description = "Google Gemini API key", required = false }
COHERE_API_KEY = { description = "Cohere API key", required = false }
AZURE_OPENAI_API_KEY = { description = "Azure OpenAI API key", required = false }
PINECONE_API_KEY = { description = "Pinecone API key (VECTOR_BACKEND=pinecone)", required = false }
TELEGRAM_BOT_TOKEN = { description = "Telegram gateway adapter bot token", required = false }
TELEGRAM_WEBHOOK_SECRET_TOKEN = { description = "Telegram webhook verification token", required = false }
DISCORD_BOT_TOKEN = { description = "Discord gateway adapter bot token", required = false }
DISCORD_PUBLIC_KEY = { description = "Discord Ed25519 request verification key", required = false }
TWILIO_ACCOUNT_SID = { description = "Twilio gateway adapter account SID", required = false }
TWILIO_AUTH_TOKEN = { description = "Twilio gateway adapter auth token", required = false }
SLACK_BOT_TOKEN = { description = "Slack gateway adapter bot token", required = false }
SLACK_SIGNING_SECRET = { description = "Slack request signing secret", required = false }
JWT_PUBLIC_KEY = { description = "API JWT auth public key (when JWT_ENABLED=true)", required = false }

[profiles.development]
